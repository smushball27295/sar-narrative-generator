[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-narrative-generator"
version = "0.1.0"
description = "Retrieval-augmented drafting of SAR narratives on synthetic data, with sentence-level citations and a verifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ramesh Krishnan Balasubramani" }]
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]
neural = ["sentence-transformers"]

[tool.setuptools]
packages = ["sarnarrative"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
